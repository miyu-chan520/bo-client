name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build arm64-v8a Binary
        run: |
          chmod +x jni/Android.mk
          ndk-build -C . NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j$(nproc)

      - name: Strip Debug Symbols
        run: |
          STRIP_TOOL="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -f "$STRIP_TOOL" ]; then
            $STRIP_TOOL --strip-all libs/arm64-v8a/surfaceflinger_helper || true
          fi

      - name: Prepare Magisk Module Directory
        run: |
          mkdir -p magisk_module/system/bin
          cp libs/arm64-v8a/surfaceflinger_helper magisk_module/system/bin/
          chmod 755 magisk_module/system/bin/surfaceflinger_helper
          chmod 755 magisk_module/service.sh
          chmod 755 magisk_module/customize.sh

      - name: Create Flashable Magisk Zip
        run: |
          cd magisk_module
          zip -r9 ../FF_Overlay_Magisk_Module_v2.0.zip ./*
          cd ..
          ls -lh FF_Overlay_Magisk_Module_v2.0.zip

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FF_Overlay_Magisk_Module_v2.0
          path: FF_Overlay_Magisk_Module_v2.0.zip
          retention-days: 14
