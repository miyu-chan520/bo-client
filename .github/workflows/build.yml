name: Build Bo-Client (External & Zygisk)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build External Binary & Zygisk Module (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Compile Native Binaries with ndk-build
        run: |
          cd jni
          ndk-build -B V=1

      - name: Assemble External Overlay Package
        run: |
          mkdir -p package_external
          cp libs/arm64-v8a/bo_service package_external/
          cat << 'EOF' > package_external/start.sh
          #!/system/bin/sh
          # NEXORA VIP External Launcher
          BASEDIR="$(cd "$(dirname "$0")" && pwd)"
          chmod +x "$BASEDIR/bo_service"
          settings put global block_untrusted_touches 0 2>/dev/null
          settings put secure block_untrusted_touches 0 2>/dev/null
          settings put system block_untrusted_touches 0 2>/dev/null
          echo "[*] Launching NEXORA VIP Hardware Overlay Service..."
          "$BASEDIR/bo_service" "$@"
          EOF
          chmod +x package_external/start.sh
          cd package_external
          zip -r ../bo-client-external-arm64.zip .

      - name: Assemble Magisk / KernelSU / APatch Zygisk Zip
        run: |
          mkdir -p package/zygisk
          cp libs/arm64-v8a/libbo_client.so package/zygisk/arm64-v8a.so
          cp module.prop package/
          cp customize.sh package/
          cd package
          zip -r ../bo-client-zygisk-v2.0.zip .

      - name: Upload External Overlay Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo-client-external-arm64
          path: bo-client-external-arm64.zip
          retention-days: 14

      - name: Upload Zygisk Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo-client-zygisk-v2.0
          path: bo-client-zygisk-v2.0.zip
          retention-days: 14
