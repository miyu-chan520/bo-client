name: Build Bo-Client Zygisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Zygisk Module (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Compile Native Module with ndk-build
        run: |
          cd jni
          ndk-build -B V=1

      - name: Assemble Magisk / KernelSU / APatch Zygisk Zip
        run: |
          mkdir -p package/zygisk
          cp libs/arm64-v8a/libbo_client.so package/zygisk/arm64-v8a.so
          cp module.prop package/
          cp customize.sh package/
          cd package
          zip -r ../bo-client-zygisk-v2.0.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo-client-zygisk-v2.0
          path: bo-client-zygisk-v2.0.zip
          retention-days: 14
