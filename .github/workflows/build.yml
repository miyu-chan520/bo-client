name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build arm64-v8a Binary
        run: |
          chmod +x jni/Android.mk
          set -o pipefail
          ndk-build -C . NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j$(nproc) 2>&1 | tee build.log || {
            ERR_MSG=$(tail -n 30 build.log | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/\r//g')
            echo "::error::$ERR_MSG"
            exit 1
          }

      - name: Strip Debug Symbols
        run: |
          STRIP_TOOL="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -f "$STRIP_TOOL" ]; then
            $STRIP_TOOL --strip-all libs/arm64-v8a/bo_service || true
          fi

      - name: Prepare Magisk Module Directory
        run: |
          mkdir -p magisk_module/system/bin
          cp libs/arm64-v8a/bo_service magisk_module/system/bin/bo_service
          cp libs/arm64-v8a/bo_service magisk_module/system/bin/surfaceflinger_helper
          chmod 755 magisk_module/system/bin/bo_service
          chmod 755 magisk_module/system/bin/surfaceflinger_helper
          chmod 755 magisk_module/service.sh
          chmod 755 magisk_module/customize.sh

      - name: Create Flashable Magisk Zip
        run: |
          cd magisk_module
          zip -r9 ../BO_Client_Magisk_Module_v2.1.zip ./*
          cd ..
          ls -lh BO_Client_Magisk_Module_v2.1.zip

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BO_Client_Magisk_Module_v2.1
          path: BO_Client_Magisk_Module_v2.1.zip
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: "BO Client Magisk Module v2.1 (Free Fire MAX & Parallax Fix)"
          body: |
            ### BO Client v2.1 (OB55 / 1.132.1)
            - **Free Fire MAX Support**: Automatic dual-target detection for both `com.dts.freefireth` and `com.dts.freefiremax`.
            - **Aimbot Parallax Fix**: Eliminated the crosshair right-of-head angular error by decoupling character body rotation from FollowCamera view orientation with horizontal parallax trim.
            - **New Gameplay Features**:
              - Zero Spread / No Spread `[RISK]` (zeroes weapon profile spread curves).
              - Silent Aim / Magic Bullet `[RISK]` (direct muzzle trajectory override).
              - Wide FOV Changer `[SAFE]` (dynamic camera field of view).
              - Proximity Threat Warning Radar `[SAFE]` (alert when enemies < 20m).
          files: BO_Client_Magisk_Module_v2.1.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
